name: CLI distribution tests
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Verify snapshot integrity
        run: python scripts/verify_snapshot.py
      - name: Linux media tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: macOS media tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows media tools
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install without GUI
        run: python -m pip install -c requirements-test.lock "setuptools>=77" ".[test]"
      - name: Test CLI-only source and installed wheel
        run: python -m pytest -q
      - name: Verify dependency consistency
        run: python -m pip check
