[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slide-extractor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "scikit-image>=0.24",
  "Pillow>=10.0",
  "ImageHash>=4.3",
  "PyMuPDF>=1.24",
]

[tool.setuptools.packages.find]
where = ["."]
